[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-replay"
version = "0.1.0"
description = "Trajectory replay for continual updates of flow-matching models"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
    "torchdiffeq>=0.2.3",
    "matplotlib>=3.5",
    "pyarrow>=15",
    "scanpy",
    "anndata",
    "diffusers>=0.27",
    "torchvision>=0.15",
    "torchmetrics>=1.0",
    "pillow>=9",
    "torch-fidelity>=0.3",
    "wandb>=0.29.0",
    "polars>=1.44.1",
    "submitit>=1.5.4",
    "timm>=1.0.29",
]

[project.optional-dependencies]
vcb = ["vcb", "loguru>=0.7.3"]
cell-eval = [
    "cell-eval>=0.7.2",
]

[tool.uv.sources]
vcb = { path = "external/vcb", editable = true }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["trajectory_replay*", "experiments*"]
exclude = ["tests*", "notebooks*", "sbatch*", "configs*", "scripts*", "external*"]
